<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
    <meta charset="UTF-8" />
